name: converthub

services:
  redis:
    image: redis:7-alpine
    container_name: converthub-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: ../docker/server.Dockerfile
    container_name: converthub-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    ports:
      - "${SERVER_PORT:-4000}:4000"
    volumes:
      - job-data:/data
    depends_on:
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: ../docker/client.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: converthub-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    depends_on:
      - server

volumes:
  redis-data:
  job-data:
